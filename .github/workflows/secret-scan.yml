name: Secret scan

# Fails a pull request, or flags a push to main, that adds a credential.
# betterleaks, from the authors of gitleaks: MIT, run from its own image, so
# no third-party Action and no license key.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the commits this event adds: a PR's own commits, or what a push
      # to main brought. Old history was scanned once by hand when this was
      # added; rescanning it on every run would only repeat that.
      # The image is pinned by digest, so a moved tag cannot change what runs.
      # Nothing watches this pin; bump it by hand (tag and digest together).
      - name: Scan new commits with betterleaks
        env:
          BETTERLEAKS_IMAGE: ghcr.io/betterleaks/betterleaks:v1.9.0@sha256:e3b95b0db6c2735db17165c009b0ad6d9cef34fb4578659232b98f69d7346cac
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$BETTERLEAKS_IMAGE" git /repo --log-opts="$range" --redact --no-banner --verbose
